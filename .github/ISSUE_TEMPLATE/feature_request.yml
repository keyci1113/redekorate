name: Feature request
description: Suggest a new research method, block, template or improvement
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem are you trying to solve?
      description: Describe the research situation, not the UI you imagine. Who is the user and what are they trying to learn?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: How you picture it working in redekorate. Sketches and references to other tools are welcome.
  - type: dropdown
    id: kind
    attributes:
      label: Kind of change
      options:
        - New research method
        - New block
        - New document template
        - Results / analysis
        - Participant experience
        - Integrations / export
        - Other
  - type: checkboxes
    id: roadmap
    attributes:
      label: Roadmap
      options:
        - label: I checked the Roadmap section of the README and this is not already planned
